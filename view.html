<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雀荘 九連｜いまの待ち状況</title>
<meta name="description" content="第27回碧風祭 雀荘九連（SUAC League）の待ち時間と卓の空き状況">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
/* お客さん用：スマホ縦1画面。待ち時間→卓→ランキングの順に、大きく読めること */
:root{
  --bg:#fff6f9; --surface:#ffffff; --ink:#2a2730; --muted:#5f5a66; --line:#f3d3e0;
  --pink:#d63a78; --pink-soft:#ffe1ed; --green:#1f8a62; --green-soft:#e2f4ec; --warn:#b26a00;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px}
header img{width:96px;height:auto;background:#fff;border-radius:14px;padding:4px}
header h1{margin:0;font-size:22px;font-weight:900;line-height:1.3}
header p{margin:0;font-size:13px;color:var(--muted)}
.wait{background:var(--green);color:#fff;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:4px}
.wait .k{font-size:14px;font-weight:700;opacity:.9}
.wait .v{font-size:56px;font-weight:900;line-height:1.1;letter-spacing:.01em}
.wait .s{font-size:15px;font-weight:700}
.note{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);border:1px solid var(--line)}
h2{margin:6px 0 0;font-size:15px;font-weight:900;letter-spacing:.04em}
.tables{display:flex;flex-direction:column;gap:10px}
.t{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;border:2px solid var(--line)}
.t.play{border-color:var(--green)}
.t .w{width:46px;height:46px;border-radius:12px;background:var(--green);color:#fff;font-size:26px;font-weight:900;display:grid;place-items:center;flex-shrink:0}
.t.free .w{background:var(--pink)}
.t .n{font-weight:900;font-size:17px}
.t .st{font-size:13px;color:var(--muted)}
.t .tm{margin-left:auto;font-family:var(--f-num);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.t.free .tm{font-family:var(--f-body);font-size:16px;font-weight:900;color:var(--pink)}
.rank{background:var(--surface);border-radius:16px;padding:6px 16px;border:1px solid var(--line)}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.rank .no{width:1.6em;font-weight:900;color:var(--muted)}
.rank li:first-child .no{color:var(--pink)}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank .pt{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tops{font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.foot{font-size:12px;color:var(--muted);text-align:center}
.err{background:#fff1d6;color:#5a3a00;border-radius:12px;padding:10px 14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="九連">
    <div><h1>雀荘 九連</h1><p>SUAC League｜南棟3階 388教室｜参加無料</p></div>
  </header>

  <div id="err" class="err" hidden></div>

  <section class="wait" aria-live="polite">
    <span class="k">いまの待ち時間 めやす</span>
    <span class="v" id="waitV">—</span>
    <span class="s" id="waitS">読み込み中…</span>
  </section>
  <div class="note">順番が来たら、受付でお名前をお呼びします。待ち時間が長いときは、ほかの展示を回ってきても大丈夫です。めやすの時間までに受付へ戻ってきてください。</div>

  <h2>卓の状況</h2>
  <div class="tables" id="tables"><div class="empty">読み込み中…</div></div>

  <h2>SUAC League 今日のハイスコア</h2>
  <div class="rank"><ol id="rank"><li class="empty">まだ記録がありません。最初のハイスコアを出すのはあなたかも。</li></ol></div>
  <h2>トップ賞（最近の1着）</h2>
  <div class="tops" id="tops"><span class="empty">1着になると、ここに名前が出ます。</span></div>

  <p class="foot" id="upd"></p>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2,"0");
  const fmtPts = n => (n>=0?"":"−")+Math.abs(n).toLocaleString("ja-JP");
  const fmtRemain = ms => { const s=Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(s/60))+":"+pad(s%60); };
  let data=null;

  // スタッフ用画面と同じ計算：4人で1卓、1対局＋入れ替え5分
  function estWaitMin(d){
    const active=d.tables||[]; if(!active.length) return null;
    const people=d.waitingPeople||0; if(!people) return 0;
    const dur=d.durationMin||30;
    const soonest=active.map(t=> t.status==="playing" ? Math.max(0,(t.endsAt||0)-Date.now())/60000+5 : 0).sort((a,b)=>a-b);
    const rounds=Math.ceil(people/4); let total=0;
    for(let i=0;i<rounds;i++){ total = soonest[i%active.length] + Math.floor(i/active.length)*(dur+5); }
    return Math.max(0,Math.round(total/5)*5);
  }
  function render(){
    if(!data) return;
    const est=estWaitMin(data);
    $("#waitV").textContent = est===null ? "準備中" : est===0 ? "すぐ遊べます" : "約"+est+"分";
    $("#waitS").textContent = (data.waitingGroups||0)+"組 待ち";
    const ts=data.tables||[];
    $("#tables").innerHTML = ts.length ? ts.map(t=>{
      const play=t.status==="playing", r=(t.endsAt||0)-Date.now();
      return `<div class="t ${play?'play':'free'}"><div class="w">${esc(t.wind)}</div><div><div class="n">${esc(t.name)}</div><div class="st">${play?(r>0?'対局中・残り時間':'まもなく終了'):'空いています'}</div></div><div class="tm">${play?(r>0?fmtRemain(r):'00:00'):'空き'}</div></div>`;
    }).join("") : '<div class="empty">卓の準備中です。</div>';
    const rk=data.ranking||[];
    $("#rank").innerHTML = rk.length ? rk.map((r,i)=>`<li><span class="no">${i+1}</span><span class="nm">${esc(r.name)}</span><span class="pt">${fmtPts(r.points)}</span></li>`).join("") : '<li class="empty">まだ記録がありません。最初のハイスコアを出すのはあなたかも。</li>';
    const tp=data.tops||[];
    $("#tops").innerHTML = tp.length ? tp.map(n=>esc(n)+" さん").join("、") : '<span class="empty">1着になると、ここに名前が出ます。</span>';
    if(data.updatedAt){ const d=new Date(data.updatedAt); $("#upd").textContent="最終更新 "+pad(d.getHours())+":"+pad(d.getMinutes()); }
  }
  setInterval(render,1000);

  const cfg=window.CHUREN_CONFIG||{};
  if(!window.firebase || !cfg.firebase || !cfg.firebase.apiKey || cfg.firebase.apiKey.startsWith("ここに")){
    $("#err").hidden=false; $("#err").textContent="ただいま準備中です。受付のスタッフに待ち時間をお尋ねください。"; $("#waitS").textContent=""; return;
  }
  firebase.initializeApp(cfg.firebase);
  firebase.firestore().doc("public/state").onSnapshot(
    d=>{ $("#err").hidden=true; data=d.exists?d.data():{tables:[],waitingGroups:0,waitingPeople:0}; render(); },
    ()=>{ $("#err").hidden=false; $("#err").textContent="待ち状況を読み込めませんでした。電波のよい場所で、ページを開き直してください。"; }
  );
})();
</script>
</body>
</html>
